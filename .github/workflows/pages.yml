# Publishes the website in src/ to GitHub Pages on every push to main.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["src/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # a new address for the scripts on every deploy, so browsers fetch them fresh
      - run: sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" src/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@v5

<script>
// theme: follows the system unless the visitor picked one with the header button
(function () {
  const root = document.documentElement, dark = matchMedia("(prefers-color-scheme: dark)");
  let saved = null;
  try { saved = localStorage.getItem("egypt-parts-search:theme"); } catch {}
  if (saved === "light" || saved === "dark") root.dataset.theme = saved;
  const apply = () => {
    const isDark = root.dataset.theme ? root.dataset.theme === "dark" : dark.matches;
    root.toggleAttribute("data-dark", isDark);
    document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.content = isDark ? "#141412" : "#f6f5f1");
  };
  window.toggleTheme = () => {
    root.dataset.theme = root.hasAttribute("data-dark") ? "light" : "dark";
    try { localStorage.setItem("egypt-parts-search:theme", root.dataset.theme); } catch {}
    apply();
  };
  dark.addEventListener("change", apply);
  apply();
})();
</script>
